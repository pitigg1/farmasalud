services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: farmacia
      POSTGRES_PASSWORD: farmacia
      POSTGRES_DB: farmacia
    ports: ["5432:5432"]
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
